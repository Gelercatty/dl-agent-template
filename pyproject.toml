[project]
name = "dl-agent-template"
version = "0.1.0"
description = "Reproducible deep-learning jobs with a practical agent collaboration workflow"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
demo = ["torch==2.8.0", "numpy==2.3.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
